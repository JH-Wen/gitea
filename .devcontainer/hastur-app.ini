APP_NAME = Gitea · Hastur Development
RUN_MODE = dev
RUN_USER = vscode

[server]
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://127.0.0.1:4319/
STATIC_ROOT_PATH = /workspaces/gitea
APP_DATA_PATH = /home/vscode/.local/share/gitea-hastur/data
DISABLE_SSH = true
OFFLINE_MODE = true

[database]
DB_TYPE = sqlite3
PATH = /home/vscode/.local/share/gitea-hastur/gitea.db

[security]
INSTALL_LOCK = true

[service]
DISABLE_REGISTRATION = true

[ui]
DEFAULT_THEME = hastur-dark

[log]
MODE = console
LEVEL = Info
